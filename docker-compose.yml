name: mcp-server

services:
  job-spy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-spy-mcp-server
    restart: unless-stopped
    init: true
    environment:
      ENABLE_SSE: "${ENABLE_SSE:-true}"
      JOBSPY_RUNNER: "${JOBSPY_RUNNER:-python}"
      JOBSPY_HOST: "${JOBSPY_HOST:-0.0.0.0}"
      JOBSPY_PORT: "${JOBSPY_PORT:-9423}"
      MALLOC_ARENA_MAX: "2"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
      ENABLE_LOCAL_PORTALS: "${ENABLE_LOCAL_PORTALS:-true}"
    ports:
      - "${JOBSPY_PORT:-9423}:9423"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 756m
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 756m
        reservations:
          memory: 512m
